name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate blue snake SVGs (dark + light)
        uses: Platane/snk@v3
        with:
          github_user_name: Bibash-24
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#93c5fd&color_dots=#0d1117,#1e3a8a,#1d4ed8,#2563eb,#3b82f6
            dist/github-snake-light.svg?palette=github-light&color_snake=#1e3a8a&color_dots=#ebedf0,#93c5fd,#60a5fa,#3b82f6,#1d4ed8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}